training:
  cv_folds: 5
  scoring: roc_auc   # metric used to rank candidates

  # Every entry is trained and cross-validated; the best one is kept.
  # Keys must exist in ESTIMATORS (src/netflix/pipelines/training/nodes.py).
  candidates:
    logistic_regression:
      C: 1.0
      max_iter: 1000
    random_forest:
      n_estimators: 300
      max_depth: 8
      min_samples_leaf: 5
    gradient_boosting:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 3
    lightgbm:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 3
    svm:
      C: 1.0
      kernel: rbf
      probability: true   # required: evaluation and the API need predict_proba
