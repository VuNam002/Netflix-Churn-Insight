training:
  cv_folds: 5
  scoring: roc_auc   # metric used to rank candidates

  # Every entry is trained and cross-validated; the best one is kept.
  # Keys must exist in ESTIMATORS (src/netflix/pipelines/training/nodes.py).
  candidates:
    logistic_regression:
      C: 1.0
      max_iter: 1000
    random_forest:
      n_estimators: 300
      max_depth: 8
      min_samples_leaf: 5
    gradient_boosting:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 3
    lightgbm:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 3
      verbose: -1   # silence LightGBM's per-fit log lines
    svm:
      C: 1.0
      kernel: rbf
      probability: true   # required: evaluation and the API need predict_proba

  # Grid search for the model that wins the comparison above (only that one).
  # Each key lists the values to try; every combination is cross-validated on the
  # train set. Keys not listed keep the value from `candidates`.
  # Cost grows with the product of the list lengths (e.g. 3 x 3 x 3 = 27 fits per fold).
  tuning:
    enabled: true
    grids:
      logistic_regression:
        C: [0.1, 1.0, 10.0]
      random_forest:
        max_depth: [6, 8, 12]
        min_samples_leaf: [1, 5, 10]
      gradient_boosting:
        n_estimators: [100, 200]
        learning_rate: [0.05, 0.1]
        max_depth: [2, 3, 4]
      lightgbm:
        n_estimators: [100, 200, 400]
        learning_rate: [0.03, 0.05, 0.1]
        max_depth: [2, 3, 5]
      svm:
        C: [0.5, 1.0, 5.0]
        kernel: [rbf, linear]
